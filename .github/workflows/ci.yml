name: CI/CD Quality & Syntax Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Lint, Compile & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: 1. Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q .

      - name: 2. Validate JSON configuration files
        run: |
          python -c "import json; json.load(open('data/sources.json', encoding='utf-8'))"

      - name: 3. Lint with Flake8 (Syntax errors & undefined names)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 4. Run Pytest test suite
        run: |
          pytest -v
